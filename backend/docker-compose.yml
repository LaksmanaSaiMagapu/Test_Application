version: "3.8"

services:
  db:
    image: docker.io/library/postgres:16.0
    container_name: geonexus-db
    environment:
      POSTGRES_DB: geonexus
      POSTGRES_USER: geonexus
      POSTGRES_PASSWORD: geonexus
    ports:
      - "5434:5432"
    volumes:
      - geonexus-db-data:/var/lib/postgresql/data

volumes:
  geonexus-db-data:
